name: Daily & Weekly Promos Auto-Update & Expired Promo Pruner

on:
  schedule:
    # Runs EVERY DAY at 06:30 UTC (07:30 CET / 08:30 CEST in Brussels) to prune expired promos and update daily offers
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Belgian Supermarket Promos Updater, Pruner & QA Suite
        run: python3 scripts/update_weekly_promos.py

      - name: Commit & Push updated weekly_data.json
        run: |
          git config user.name "NutriBatch Cloud Bot"
          git config user.email "bot@nutribatch.local"
          git add weekly_data.json index.html
          git diff --staged --quiet || git commit -m "chore(daily-promos): vérification quotidienne et retrait des promotions expirées"
          git push
