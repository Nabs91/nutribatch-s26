name: Hebdo Promos & Batch Cooking Auto-Update

on:
  schedule:
    # Runs every Saturday at 08:00 UTC (09:00 CET / 10:00 CEST in Brussels)
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Weekly Belgian Supermarket Promos Updater & QA Suite
        run: python3 scripts/update_weekly_promos.py

      - name: Commit & Push updated weekly_data.json
        run: |
          git config user.name "NutriBatch Cloud Bot"
          git config user.email "bot@nutribatch.local"
          git add weekly_data.json index.html
          git diff --staged --quiet || git commit -m "chore(hebdo): mise à jour automatique des promos et du batch cooking"
          git push
